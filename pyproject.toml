[project]
name = "demo-video-generator"
version = "0.1.0"
description = "Generate product demo videos from still frames + VOICEVOX narration, manifest-driven and deterministic."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["demo-video", "voicevox", "narration", "ffmpeg", "pillow", "screen-recording"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "click>=8.1",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.scripts]
demo-video-generator = "demo_video_generator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires VOICEVOX or ffmpeg (deselect with -m 'not integration')",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true